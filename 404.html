<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТЦК</title>
<style>html,body{margin:0;height:100%;background:#1a0e20;color:#fde98f;font:bold 18px/1.4 monospace}
body{display:flex;align-items:center;justify-content:center;text-align:center}a{color:#fde98f}</style>
<script>
// Перенаправлення на гру: спершу ./ (поруч), якщо й там 404 — на рівень вище (до 4 разів), далі просто посилання.
(function () {
  var n = 0;
  try { var s = JSON.parse(sessionStorage.getItem('tck404') || 'null'); if (s && Date.now() - s.t < 8000) n = s.n + 1; } catch (e) {}
  if (n > 4) return;
  try { sessionStorage.setItem('tck404', JSON.stringify({ n: n, t: Date.now() })); } catch (e) {}
  var up = ''; for (var i = 0; i < n; i++) up += '../';
  location.replace((up || './') + 'index.html');
})();
</script>
</head>
<body><p>Сторінку не знайдено.<br><a href="./index.html">Грати в ТЦК</a></p></body>
</html>
