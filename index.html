<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="ТЦК">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' shape-rendering='crispEdges'%3E%3Crect width='12' height='12' fill='%232a1a2e'/%3E%3Crect x='1' y='2' width='10' height='2' fill='%23f7c948'/%3E%3Crect x='4' y='4' width='4' height='5' fill='%23f7c948'/%3E%3Crect y='10' width='12' height='1' fill='%23d8443a'/%3E%3Crect y='11' width='12' height='1' fill='%233c6fb4'/%3E%3C/svg%3E">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
  /* iOS Safari: без «гумового» скролу сторінки; висота — динамічний viewport (нижня панель Safari) */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: 100dvh; }
  canvas#game, #rotate { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #boot { position: fixed; inset: 0; z-index: 20; background: #1a0e20; color: #fde98f; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font: bold 16px/1.4 monospace; padding: 0 20px; }
  #boot h1 { margin: 0 0 18px; font: bold clamp(30px, 8vw, 54px)/1.1 monospace; color: #ff5a4a; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
  #boot .bar { width: min(280px, 70vw); height: 12px; border: 3px solid #fde98f; overflow: hidden; margin-bottom: 14px; }
  #boot .bar i { display: block; width: 35%; height: 100%; background: #ff5a4a; animation: bootbar 1.1s ease-in-out infinite alternate; }
  @keyframes bootbar { from { margin-left: 0; } to { margin-left: 65%; } }
  #boot small { color: #b4abb2; font-weight: normal; font-size: 13px; }
  canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; cursor: default; touch-action: none; }
  /* зонд для safe-area (00_core читає його padding) */
  #sa { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* «Поверни телефон» — лише на сенсорних у портреті */
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #1a0e20; color: #fde98f;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font: bold 22px/1.3 monospace; letter-spacing: 1px; }
  #rotate .ph { width: 44px; height: 76px; border: 5px solid #fde98f; border-radius: 8px; margin-bottom: 22px;
    animation: rot 1.8s ease-in-out infinite; box-sizing: border-box; }
  #rotate small { display: block; margin-top: 8px; font-size: 13px; color: #b4abb2; font-weight: normal; }
  @keyframes rot { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { html.touch #rotate { display: flex; } }
  /* Round 18: одноразова підказка на iOS поза режимом «На початковий екран» — вбудовані браузери (Telegram/Instagram) і Safari
     додають панелі, гра виходить меншою */
  #fshint { display: none; position: fixed; z-index: 11; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 8px); max-width: min(92vw, 520px); box-sizing: border-box;
    background: rgba(26,14,32,0.95); color: #fbf6ea; border: 2px solid #fde98f; border-radius: 6px;
    font: 12px/1.35 monospace; padding: 7px 34px 7px 10px; text-align: left; }
  #fshint b { color: #fde98f; }
  #fshint .x { position: absolute; right: 2px; top: 2px; width: 28px; height: 28px; line-height: 28px; text-align: center;
    font-size: 16px; color: #fde98f; }
  @media (orientation: portrait) { #fshint { top: auto; bottom: calc(env(safe-area-inset-bottom) + 16px); } }
  html.fshint #fshint { display: block; }
</style>
</head>
<body>
<div id="boot"><h1>ТИ В РОЗШУКУ</h1><div class="bar"><i></i></div><span id="bootmsg">Завантажується…</span><small>На повільному інтернеті це може зайняти до хвилини</small></div>
<canvas id="game" tabindex="0"></canvas>
<div id="sa"></div>
<div id="rotate"><div class="ph"></div>Поверни телефон<small>гра — лише в альбомній орієнтації</small></div>
<div id="fshint" role="note"><b>Для повного екрана:</b> ⋯ → Відкрити в Safari, або Поділитися → На початковий екран<span class="x" aria-label="Закрити">✕</span></div>
<script src="game.4ccea6e0a5.js" onerror="var m=document.getElementById('bootmsg');if(m)m.textContent='Не вдалося завантажити. Перевір інтернет і онови сторінку.'"></script>
</body>
</html>
